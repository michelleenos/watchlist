# Ruff configuration — https://docs.astral.sh/ruff/
# Targets the lowest Python you intend to support; adjust if needed.
target-version = "py313"

line-length = 88
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
# E/W = pycodestyle, F = pyflakes, I = isort (import sorting),
# UP = pyupgrade, B = flake8-bugbear (common gotchas).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501", # line-too-long — the formatter handles wrapping
]